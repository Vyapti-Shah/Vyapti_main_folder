<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image → 3D Studio</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head><body>
<header><b>IMAGE → 3D STUDIO</b><span id="health"></span></header>
<main>
<aside>
  <section><h3>1 · Upload</h3>
    <label class="drop" id="drop">Drop or click to choose a JPG / PNG<input type="file" id="file" accept="image/*" hidden></label></section>
  <section id="detSec" hidden><h3>2 · Detected objects</h3>
    <div class="pv"><img id="img"><canvas id="ov"></canvas></div><div id="objs"></div></section>
  <section id="genSec" hidden><h3>3 · Generate</h3>
    <label>Object engine<select id="engine"><option value="trellis">TRELLIS</option><option value="hunyuan" selected>Hunyuan3D-2.1</option></select></label>
    <label>People<select id="pmode"><option value="smplx">Pose-accurate (SMPL-X + texture projection)</option><option value="engine">Same engine as objects</option></select></label>
    <button id="go">Generate 3D</button><pre id="log"></pre></section>
</aside>
<div id="stage">
  <div class="bar" id="views">
    <button data-v="front">Front</button><button data-v="back">Back</button><button data-v="left">Left</button>
    <button data-v="right">Right</button><button data-v="top">Top</button><button data-v="bottom">Bottom</button>
    <label><input type="checkbox" id="wire"> wireframe</label><label><input type="checkbox" id="spin"> auto-rotate</label>
    <label><input type="checkbox" id="grid" checked> grid</label>
  </div>
  <div class="bar bottom" id="dl" hidden><span id="parts"></span><a id="dlglb">Download GLB</a><a id="dlobj">Download OBJ</a></div>
  <div class="hint">drag: rotate · wheel: zoom · right-drag: move</div>
</div>
</main>
<script type="module" src="app.js"></script></body></html>
