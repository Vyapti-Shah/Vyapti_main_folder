server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: any unknown path is a client route, not a 404.
  location / { try_files $uri $uri/ /index.html; }

  # Same-origin /api so the client can use relative URLs and needs no CORS.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    # Renders are large files served with range requests; buffering them here
    # would break seeking and hold whole videos in nginx memory.
    proxy_buffering off;
    client_max_body_size 2048m;   # source videos are the upload, not a form post
    proxy_read_timeout 3600s;     # a render poll can outlive the default 60s
  }
}
