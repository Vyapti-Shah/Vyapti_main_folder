server {
    listen 80;
    server_name _;
    client_max_body_size 2G;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2G;
    }

    location / {
        try_files $uri /index.html;
    }
}
