server {
  listen 80;
  client_max_body_size 500m;
  root /usr/share/nginx/html;
  location /outputs/ {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
}